#
# define display information
#
name: EFI-EST Sequence BLAST

tooltip: |
    Enzyme Function Initiative (EFI) Tools

screenshots: []

icon: efi-est_logo.png

#
# define a set of similar apps that might be useful to the user
#
suggestions:
    apps:
        related: [run_EFI_EST_Families, run_EFI_EST_FASTA, run_EFI_EST_Accession_IDs]
        next: [run_EFI_EST_SSN_Creation]

publications:
    - display-text: 'Rémi Zallot, Nils Oberg, and John A. Gerlt, The EFI Web Resource for Genomic Enzymology Tools: Leveraging Protein, Genome, and Metagenome Databases to Discover Novel Enzymes and Metabolic Pathways. Biochemistry 2019 58 (41), 4169-4182'
      link: https://doi.org/10.1021/acs.biochem.9b00735

    - display-text: 'Nils Oberg, Rémi Zallot, and John A. Gerlt, EFI-EST, EFI-GNT, and EFI-CGFP: Enzyme Function Initiative (EFI) Web Resource for Genomic Enzymology Tools. J Mol Biol 2023.'
      link: https://doi.org/10.1016/j.jmb.2023.168018

#
# Configure the display and description of parameters
#
parameters:
    import_sequence:
        ui-name: Query Sequence
        short-hint: |
            The protein sequence to submitted to an initial BLAST Search
        long-hint: |
             The input sequence is used as the query for a search of the UniProt, UniRef90, or UniRef50 database using BLAST. For the UniRef90 and UniRef50 databases, the sequence of the cluster ID (representative sequence) is used for the BLAST. # this last setence is confusing if not inaccurate
             After a set of high-similarity sequences are gathered from this initial BLAST alignment, an all-by-all BLAST is performed to obtain the similarities between sequence pairs to calculate edge values to generate the SSN.

    import_blast_evalue:
        ui-name: Negative log of e-value applied during sequence alignments to the Query Sequence
        short-hint: |
            Negative log of e-value applied during the initial BLAST sequence alignments to the Query Sequence.
        long-hint: |
            Input a negative log'd value of the desired expect value (e-value) to be applied during the initial BLAST sequence alignments against the Query Sequence. The default parameter (5) equates to a 1x10^{-5} e-value cutoff; alignments with an e-value above this cutoff will be ignored. This is a useful cutoff value to gather high sequence similarity hits. However, a smaller input value (larger, less stringent e-value cutoff) should be used when sequences are short or when a larger set of input sequences are needed.
    
    import_blast_num_matches:
        ui-name: Maximum sequences retrieved
        short-hint: |
            Maximum number of sequences retrieved by BLAST
            
    sequence_database:
        ui-name: Sequence Database
        short-hint: |
            The Sequence databse to BLAST against
            
    est_object_name:
        ui-name: Name for the final BlastEdgeFile Object
        short-hint: |
            Short, descriptive filename (no spaces nor dashes) to be used to name the BlastEdgeFile data object created by this App.

    #
    # Fragment filter parameter
    #
    exclude_fragments:
        ui-name: Exclude UniProt-defined fragments in the results?
        short-hint: |
            Check to exclude UniProt-defined fragments in the results (default: off). For the UniRef90 and UniRef50 databases, clusters are excluded if the cluster ID ("representative sequence") is a fragment. UniProt IDs in UniRef90 and UniRef50 clusters with complete cluster IDs are removed from the clusters if they are fragments.
        # probably should have a long-hint

    #
    # Taxonomy filter parameters; NEEDS MAJOR UPDATE
    #
    taxonomic_level:
        ui-name: Taxonomic Level
        short-hint: |
            Which level of taxomony to which the filter string is applied
    
    taxon_filter_string:
        ui-name: Filter string
        short-hint: |
            The filter to apply, may inlcude NOT at the beginning

    #
    # Family Addition parameters
    #
    families:
        ui-name: Families
        short-hint: |
            The input format is a single family or comma/space separated list of families
        long-hint: |
            The input format is a single family or comma/space separated list of families. Families should be specified as PFxxxxx (five digits), IPRxxxxxx (six digits) or CLxxxx (four digits) for Pfam clans. Added sequences will be gathered from the same source (UniProt, UniRef90, or UniRef50) as the input Accession IDs.

    fraction:
        ui-name: Fraction
        short-hint: |
            Reduce the number of added families' sequences to a fraction of the full family size (≥ 1; default: 1). Note, either Fraction or a UniRef sequence source can be used. Not both.
        long-hint: |
            Selects every Nth sequence in the family; the sequences are assumed to be added randomly to UniProtKB, so the selected sequences are assumed to be a representative sampling of the family. This allows reduction of the size of the SSN. Sequences in the family with SwissProt annotations will always be included; this may result in the size of the resulting data set being slightly larger than the fraction specified.

    #
    # all-by-all blast parameters
    #
    blast_e_value:
        ui-name: Negative log of e-value for all-by-all BLAST
        short-hint: |
            Negative log of e-value applied during the all-by-all BLAST sequence alignment calculations.
        long-hint: |
            Input a negative log'd value of the desired expect value (e-value) to be applied during the all-to-all BLAST sequence alignment calculations. The default parameter (5) equates to a 1x10^{-5} e-value cutoff; alignments with an e-value above this cutoff will be ignored. This is a useful cutoff value for most sequence sets. However, a smaller input value (larger, less stringent e-value cutoff) should be used when sequences are short or when low pairwise identity is hindering classifying distinct SSN clusters.

    blast_num_matches:
        ui-name: Number of alignment hits
        short-hint: |
            The maximum number of sequence alignment hits reported from Blast for each input sequence. Default value is 250.
        long-hint: |
            The top N alignment hits are reported for each sequence in the input set from the all-by-all Blast calculations. The default value is 250, which provides a reasonable number of similarity scores for each sequence to produce informative SSN clustering while decreasing SSN size. Decreasing this value will lose clustering resolution. Increasing the value will increase resolution but can also greatly increase the SSN .xgmml file size.

parameter-groups:
    import_blast_sequence_options:
        ui-name: BLAST Retrieval Options
        short-hint: |
            Parameters for for the initial BLAST sequence alignment calculations to gather sequences similar to the input sequence. 
    
    fragment_option:
        ui-name: Fragment Option
        short-hint: |
            UniProt designates a Sequence Status for each member: "Complete" if the encoding DNA sequence has both start and stop codons; "Fragment" if the start and/or stop codon is missing. Approximately 10% of the entries in UniProt are fragments.

    taxonomy_filter_options:
        ui-name: Filter by Taxonomy
        short-hint: |
            A taxonomy filter is applied to the list of UniProt, UniRef90, or UniRef50 cluster IDs retrieved by the BLAST
            
    protein_family_addition_options:
        ui-name: Protein Family Addition Options
        short-hint:
            Add sequences belonging to the specified Pfam and/or InterPro families.

    all_by_all_blast_options:
        ui-name: All-By-All Blast Options
        short-hint: |
            Set parameters to be used when performing the `blastall -p blastp` sequence alignment calculations.

description: |
    <p> <a href="https://efi.igb.illinois.edu/">Enzyme Function Initiative</a></p>
