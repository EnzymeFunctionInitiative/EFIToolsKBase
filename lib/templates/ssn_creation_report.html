<!doctype html>
<html>
  <head>
    <style>
      table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
        padding: 0.2em;
      }
    </style>
  </head>
 <body>
    <h3>SSN Statistics</h3>
    <table>
     <tr>
       <td>Number of Nodes</td>
       <td>{{ num_nodes }}</td>
     </tr>
     <tr>
       <td>Number of Edges</td>
       <td>{{ num_edges }}</td>
     </tr>
     <tr>
       <td> Size of SSN File (GB)</td>
       <td>{{ size }}</td>
     </tr>
    </table>
 </body>
</html>
